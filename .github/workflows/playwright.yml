name: Playwright Tests

env:
  NODE_VERSION: '22.22'
  PNPM_VERSION: '10.30.3'

on:
  workflow_dispatch:

jobs:
  setup:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE: 1
      DD_TAGS: layer:e2e
    steps:
      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: opengovsg/FormSG
          ref: refs/heads/release-al2

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: demo

      - name: Replace files with demo-specific ones
        run: |
          cp -rf demo/v2/* ./
          rm -rf demo/

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_APP_FORMSG_SDK_MODE: 'test'
        run: pnpm build:sdk && pnpm --filter formsg-shared --filter formsg-monorepo build
      - name: Cache build artifacts
        uses: actions/cache/save@v3.5.0
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
            packages/shared/node_modules
            packages/sdk/node_modules
            apps/frontend/dist
            apps/backend/dist
            packages/shared/dist
            packages/sdk/dist
            services/virus-scanner/build
            services/virus-scanner-guardduty/build
          key: ${{ runner.os }}-build-playwright-${{ github.sha }}
  test:
    needs: setup
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          [
            'chromium-login',
            'chromium-encrypt-submission',
            'firefox-login',
            'firefox-encrypt-submission',
          ]
    env:
      AWS_SDK_JS_SUPPRESS_MAINTENANCE_MODE_MESSAGE: 1
      DD_TAGS: layer:e2e
      SHARD_COUNT: 4
    steps:
      - name: Checkout upstream repo
        uses: actions/checkout@v4
        with:
          repository: opengovsg/FormSG
          ref: refs/heads/release-al2

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: demo

      - name: Replace files with demo-specific ones
        run: |
          cp -rf demo/v2/* ./
          rm -rf demo/
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore build artifacts
        uses: actions/cache/restore@v3.5.0
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
            packages/shared/node_modules
            packages/sdk/node_modules
            apps/frontend/dist
            apps/backend/dist
            packages/shared/dist
            packages/sdk/dist
            services/virus-scanner/build
            services/virus-scanner-guardduty/build
          key: ${{ runner.os }}-build-playwright-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
